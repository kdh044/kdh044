name: BOJ Revival Counter

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update BOJ revival counter
        run: |
          python <<'PY'
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          import re

          shutdown_date = date(2026, 4, 28)
          today = datetime.now(ZoneInfo("Asia/Seoul")).date()
          day_count = (today - shutdown_date).days + 1

          path = "README.md"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          title = f"<h1>백준 부활 기원 {day_count}일차</h1>"
          content = re.sub(
              r"<h1>백준 부활 기원 \d+일차</h1>",
              title,
              content,
              count=1,
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update BOJ revival counter"
          git push
